<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jas Kiding...</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue-deep: #0a1628;
      --blue-mid: #0f2447;
      --blue-accent: #2563eb;
      --blue-light: #3b82f6;
      --blue-glow: #60a5fa;
      --blue-pale: #bfdbfe;
      --white: #f8faff;
      --muted: rgba(191, 219, 254, 0.45);
    }

    html, body {
      height: 100%;
      background: var(--blue-deep);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 10%, rgba(37,99,235,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(59,130,246,0.12) 0%, transparent 65%);
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(96,165,250,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(96,165,250,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(37,99,235,0.15);
      border: 1px solid rgba(96,165,250,0.25);
      border-radius: 100px;
      padding: 8px 20px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blue-pale);
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeDown 0.8s ease forwards 0.2s;
    }

    .badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--blue-glow);
      box-shadow: 0 0 8px var(--blue-glow);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .heading {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(42px, 9vw, 88px);
      line-height: 1.05;
      text-align: center;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp 1s ease forwards 0.4s;
    }

    .heading em {
      font-style: italic;
      color: transparent;
      background: linear-gradient(135deg, var(--blue-glow), var(--blue-pale));
      -webkit-background-clip: text;
      background-clip: text;
    }

    /* Foto Rijal Ekonomi */
    .foto-wrap {
      margin: 8px 0 24px;
      opacity: 0;
      animation: fadeUp 1s ease forwards 0.55s;
    }

    .foto-wrap img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      object-position: center top;
      border-radius: 20px;
      border: 2px solid rgba(96,165,250,0.35);
      box-shadow: 0 0 32px rgba(37,99,235,0.4);
      display: block;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--blue-accent), transparent);
      margin: 28px auto;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.6s;
    }

    .names {
      display: flex;
      gap: 16px;
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.7s;
    }

    .name-chip {
      background: rgba(37,99,235,0.12);
      border: 1px solid rgba(96,165,250,0.3);
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.03em;
      color: var(--blue-pale);
      transition: background 0.3s, border-color 0.3s, transform 0.3s;
      cursor: default;
    }

    .name-chip:hover {
      background: rgba(37,99,235,0.25);
      border-color: rgba(96,165,250,0.6);
      transform: translateY(-3px);
    }

    .card {
      background: rgba(15,36,71,0.6);
      border: 1px solid rgba(96,165,250,0.15);
      border-radius: 24px;
      padding: 48px 52px;
      max-width: 640px;
      width: 100%;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 1s ease forwards 0.9s;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(96,165,250,0.5), transparent);
    }

    .card p {
      font-size: 16px;
      line-height: 1.85;
      color: rgba(248,250,255,0.75);
      font-weight: 300;
    }

    .card p + p { margin-top: 20px; }

    .card p strong {
      color: var(--blue-pale);
      font-weight: 500;
    }

    .quote-mark {
      font-family: 'DM Serif Display', serif;
      font-size: 80px;
      line-height: 0.6;
      color: rgba(96,165,250,0.15);
      display: block;
      margin-bottom: 12px;
      user-select: none;
    }

    /* Teks bawah gede */
    .big-caption {
      margin-top: 40px;
      text-align: center;
      font-size: clamp(18px, 4vw, 26px);
      font-weight: 500;
      color: var(--blue-pale);
      line-height: 1.5;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1.2s;
    }

    .signature {
      margin-top: 40px;
      text-align: right;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1.2s;
    }

    .signature span {
      font-family: 'DM Serif Display', serif;
      font-style: italic;
      font-size: 22px;
      color: var(--blue-pale);
    }

    .signature small {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      letter-spacing: 0.08em;
    }

    .btn-wrap {
      margin-top: 52px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 1.4s;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--blue-accent);
      color: #fff;
      border: none;
      border-radius: 100px;
      padding: 16px 36px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.25s, transform 0.25s, box-shadow 0.25s;
      box-shadow: 0 4px 24px rgba(37,99,235,0.35);
    }

    .btn:hover {
      background: var(--blue-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(59,130,246,0.5);
    }

    .btn:active { transform: translateY(0); }

    .emoji-float {
      position: fixed;
      font-size: 28px;
      pointer-events: none;
      animation: floatUp 3.5s ease-out forwards;
      z-index: 10;
    }

    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-200px) scale(0.5); }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .card { padding: 32px 28px; }
      .names { flex-direction: column; align-items: center; }
    }
  </style>
</head>

<script>
  function sendLove() {
    const emojis = ['💙','🙏','✨','💫','🌊','🥺','👉','👈'];
    for (let i = 0; i < 14; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'emoji-float';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 90 + 5 + 'vw';
        el.style.bottom = '80px';
        el.style.animationDuration = (2.5 + Math.random() * 2) + 's';
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }, i * 100);
    }

    const btn = document.querySelector('.btn');
    btn.textContent = 'awasss🥴';
    btn.style.background = '#1d4ed8';
    btn.disabled = true;
    setTimeout(() => {
      btn.textContent = '🥺 maap yahh';
      btn.style.background = '';
      btn.disabled = false;
    }, 4000);
  }
</script>
