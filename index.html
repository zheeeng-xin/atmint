<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Maaf ya 😔</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@700;900&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      min-height:100vh;
      background:#0d1b2e;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:30px 16px;
      font-family:'Nunito',sans-serif;
    }
    h1{
      font-family:'Anton',sans-serif;
      font-size:clamp(1.2rem,5vw,1.7rem);
      color:#5ba8f5;
      letter-spacing:2px;
      text-align:center;
      margin-bottom:24px;
      text-transform:uppercase;
    }
    .meme-container{display:flex;flex-direction:column;gap:20px;max-width:400px;width:100%;}
    .meme{
      position:relative;border-radius:18px;overflow:hidden;
      border:2px solid rgba(91,168,245,.3);
      box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 20px rgba(45,125,210,.15);
    }
    .meme img{width:100%;display:block;filter:brightness(.95);}
    .meme-text{
      position:absolute;bottom:0;left:0;right:0;
      padding:14px 16px;
      background:linear-gradient(transparent,rgba(0,0,0,.75));
      font-family:'Anton',sans-serif;
      font-size:clamp(1.3rem,6vw,2rem);
      color:#fff;
      text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;
      letter-spacing:1px;text-align:center;
    }
    .meme-text.top{
      top:0;bottom:auto;
      background:linear-gradient(rgba(0,0,0,.65),transparent);
      padding-top:14px;
    }
    .bubble{
      background:linear-gradient(135deg,rgba(13,39,72,.9),rgba(10,22,40,.95));
      border:1px solid rgba(91,168,245,.25);
      border-radius:18px;padding:22px 24px;text-align:center;
      box-shadow:0 4px 24px rgba(0,0,0,.4);
    }
    .bubble p{font-size:1rem;color:#cce0ff;line-height:1.8;font-weight:700;}
    .bubble p span{color:#5ba8f5;}
    .footer{margin-top:10px;font-size:.75rem;color:rgba(91,168,245,.4);letter-spacing:2px;text-transform:uppercase;text-align:center;}
    .btn{
      margin-top:24px;cursor:pointer;border:none;
      background:linear-gradient(135deg,#2d7dd2,#5ba8f5);
      color:#0a1628;font-family:'Nunito',sans-serif;
      font-size:1rem;font-weight:900;padding:14px 38px;border-radius:99px;
      box-shadow:0 4px 20px rgba(45,125,210,.4);transition:transform .15s,box-shadow .15s;
    }
    .btn:hover{transform:scale(1.05);box-shadow:0 6px 30px rgba(45,125,210,.6);}
    .btn:active{transform:scale(.96);}
    .floater{position:fixed;pointer-events:none;font-size:1.6rem;animation:goUp 1.4s ease-out forwards;z-index:999;}
    @keyframes goUp{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-180px) scale(.4);}}
  </style>
</head>

<script>
function boom(e){
  var list=['💙','😂','🙏','✨','🩵','😭','💎'];
  for(var i=0;i<16;i++){
    (function(i){
      setTimeout(function(){
        var el=document.createElement('div');
        el.className='floater';
        el.textContent=list[Math.floor(Math.random()*list.length)];
        el.style.left=(e.clientX+(Math.random()-.5)*140)+'px';
        el.style.top=(e.clientY+(Math.random()-.5)*60)+'px';
        document.body.appendChild(el);
        setTimeout(function(){el.remove();},1500);
      },i*70);
    })(i);
  }
  e.currentTarget.textContent='Makasih Udah Maafin 😭💙';
}
</script>
